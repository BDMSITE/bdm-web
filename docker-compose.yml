# Dev local : Postgres + Meilisearch
# Démarrer : docker compose up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bdm
      POSTGRES_PASSWORD: bdm
      POSTGRES_DB: bdm
    ports:
      # 5433 côté hôte : un Postgres Homebrew occupe souvent déjà 5432
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: dev-master-key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data
volumes:
  db-data:
  meili-data:
